name: OpenCourt checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencourt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: pnpm
     
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint checks
        run: pnpm lint

      - name: Run type checks
        run: pnpm typecheck

      # GitHub does not provide repository secrets to workflows from forks or
      # Dependabot pull requests. Keep those builds useful while requiring the
      # configured secret for trusted pushes, manual runs, and same-repo PRs.
      - name: Check server API configuration
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          OPENC_API_KEY: ${{ secrets.OPENC_API_KEY }}
        run: pnpm check:openc-api-key

      - name: Build website
        env:
          OPENC_API_KEY: ${{ secrets.OPENC_API_KEY }}
        run: pnpm build
